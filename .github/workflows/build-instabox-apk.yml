name: Build InstaBox APK

# Personal fork: builds a release APK with the InstaBox wake hook compiled in.
# Everything happens on the runner; the developer machine needs no Flutter SDK.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-instabox-apk.yml'
      - 'app/lib/remote/ssh/instabox_wake.dart'
      - 'app/lib/remote/ssh/ssh_link.dart'

permissions:
  contents: read

concurrency:
  group: instabox-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  INSTABOX_SSH_HOST: ssh.instabox.sh
  INSTABOX_MACHINE_ID: m_agqylm4u2qljvnpneljimslusa

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prepare project
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          # Explicit release signing from the committed throwaway keystore. AGP's
          # own debug keystore path is not reliable on runners (ANDROID_SDK_HOME
          # moves it) and a regenerated key changes the signature every run, so
          # a rebuilt APK could not install over the previous one.
          printf 'storeFile=%s\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' \
            "$GITHUB_WORKSPACE/app/android/debug.keystore" > android/key.properties
          (cd android && gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon)

      - name: Build arm64 release APK
        working-directory: app
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          if [ -z "$INSTABOX_API_KEY" ]; then
            echo "::warning::INSTABOX_API_KEY secret is empty - the wake hook will be disabled"
          fi
          flutter build apk --release \
            --flavor arm64 \
            --target-platform android-arm64 \
            --dart-define=INSTABOX_SSH_HOST="$INSTABOX_SSH_HOST" \
            --dart-define=INSTABOX_MACHINE_ID="$INSTABOX_MACHINE_ID" \
            --dart-define=INSTABOX_API_KEY="$INSTABOX_API_KEY"

      - name: Show artifact
        working-directory: app
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Sign APK with the project keystore
        working-directory: app
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          APK=build/app/outputs/flutter-apk/app-arm64-release.apk
          "$APKSIGNER" sign \
            --ks android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out build/app/outputs/flutter-apk/app-signed.apk "$APK"
          mv build/app/outputs/flutter-apk/app-signed.apk "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | head -3

      - name: Print signing certificate
        working-directory: app
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-release.apk | head -6
          else
            keytool -list -v -keystore android/debug.keystore -storepass android | grep -E 'SHA256|Alias' | head -4
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-instabox-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
